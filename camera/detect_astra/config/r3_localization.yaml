# Localization only: consumes the existing hardware/EKF TF and LiDAR scan.
# Keep the AMCL motion model aligned with nav_real.launch.py's real overrides.
# A map and explicit initial pose must be selected for this physical trial.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_filtered
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.03
    alpha2: 0.02
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.03
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.03
    update_min_a: 0.02
    transform_tolerance: 0.5
    tf_broadcast: true
    # The robot is moved by hand between trials. Neither map origin nor an
    # unbound saved pose is a trustworthy initial pose after that move.
    set_initial_pose: false
    always_reset_initial_pose: true

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: map
