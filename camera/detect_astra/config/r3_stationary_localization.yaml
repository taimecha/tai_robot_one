# Applied by stationary_inspection or precision_localization launch profiles.
# A product likelihood gives one-scan evidence without repeated parked updates.
# Beam skipping reduces the influence of objects absent from the saved map.
amcl:
  ros__parameters:
    laser_model_type: likelihood_field_prob
    sigma_hit: 0.10
    z_hit: 0.90
    z_rand: 0.10
    do_beamskip: true
    beam_skip_distance: 0.25
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90
    max_beams: 120
    min_particles: 2000
    max_particles: 4000
