esp32_imu_bridge:
  ros__parameters:
    port: /dev/tai_imu
    baud: 115200
    frame_id: imu_link
    topic: /imu/data
    reconnect_interval: 2.0
    diagnostic_interval: 5.0
    orientation_variance: 0.0004
    angular_velocity_variance: 0.0004
    linear_acceleration_variance: 0.04
    max_lines_per_cycle: 20
