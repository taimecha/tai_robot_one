# Geometry and nominal lift targets for the 4 x 2 x 2 warehouse rack.
# All linear values are in metres and masses are in kilograms.
warehouse_rack:
  layout:
    columns_per_face: 4
    levels_per_face: 2
    faces: 2
    capacity: 16
    overall_width: 1.310
    overall_depth: 0.820
    overall_height: 0.680
    bay_clear_width: 0.290
    support_levels: [0.090, 0.370]

  pallet:
    length: 0.340
    width: 0.250
    height: 0.035
    deck_thickness: 0.010
    tunnel_width: 0.190
    tunnel_height: 0.025
    runner_width: 0.030
    simulated_mass: 0.5

  box:
    length: 0.310
    width: 0.220
    height: 0.220
    simulated_mass: 0.5

  robot_interface:
    fork_length: 0.390
    fork_pair_width: 0.155
    fork_thickness: 0.008
    minimum_fork_underside_height: 0.065
    lift_travel: 0.520

    # Insert with the fork underside 5-7 mm above each support rail.
    insertion_joint_positions: [0.032, 0.312]

    # Raise another 15 mm before withdrawing the pallet from the rack.
    extraction_joint_positions: [0.047, 0.327]

  clearances:
    pallet_to_bay_each_side: 0.020
    fork_to_tunnel_each_side: 0.0175
    fork_length_beyond_pallet: 0.050
    vertical_between_loaded_pallets: 0.025
    vertical_above_top_load: 0.055
