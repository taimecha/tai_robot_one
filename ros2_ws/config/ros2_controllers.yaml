controller_manager:
  ros__parameters:
    use_sim_time: true
    # Match the firmware/control contract and avoid spending simulation CPU on
    # updates that neither the 50 Hz base loop nor Nav2 can use.
    update_rate: 50
    # Gazebo already enforces the URDF effort/velocity/position limits. The
    # controller_manager effort limiter otherwise alternates lift effort
    # between max and zero at exactly 0.05 m/s, so the carriage cannot climb
    # against gravity. The real-hardware config keeps this enabled.
    enforce_command_limits: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_controller:
      type: diff_drive_controller/DiffDriveController

    # Gazebo's native position command path does not move this constrained
    # prismatic chain reliably. A simulation-only position loop commands this
    # low-level effort controller while preserving the public position API.
    lift_effort_controller:
      type: effort_controllers/JointGroupEffortController

base_controller:
  ros__parameters:
    use_sim_time: true

    # Physical ordering: +Y is left, -Y is right; front/rear motors remain
    # independent command and encoder channels within each skid-steer side.
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint

    wheel_separation: 0.428
    wheel_radius: 0.0875
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_frame_prefix_enable: false
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.10]
    twist_covariance_diagonal: [0.02, 0.02, 1000000.0, 1000000.0, 1000000.0, 0.20]

    # Encoder-derived wheel positions are the raw odometry source. The EKF is
    # the sole publisher of odom -> base_footprint in both simulation and real
    # bringup, which prevents two competing TF publishers.
    open_loop: false
    position_feedback: true
    enable_odom_tf: false
    velocity_rolling_window_size: 10

    cmd_vel_timeout: 0.25
    publish_limited_velocity: true

    # Forklift body limits.  The wheel interfaces also cap tangential wheel
    # speed at 0.50 m/s, including combined translation and rotation commands.
    linear.x.max_velocity: 0.50
    linear.x.min_velocity: -0.50
    linear.x.max_acceleration: 0.50
    linear.x.max_deceleration: -0.50
    linear.x.max_acceleration_reverse: -0.50
    linear.x.max_deceleration_reverse: 0.50
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.max_velocity: 1.20
    angular.z.min_velocity: -1.20
    angular.z.max_acceleration: 1.50
    angular.z.max_deceleration: -1.50
    angular.z.max_acceleration_reverse: -1.50
    angular.z.max_deceleration_reverse: 1.50
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN

lift_effort_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - lift_joint
